services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB:       mahjong
      POSTGRES_USER:     mahjong
      POSTGRES_PASSWORD: ${MAHJONG_DB_PASSWORD:-mahjong}
    ports:
      # loopback only: the server reaches Postgres over the compose network, so
      # nothing outside this machine has any reason to
      - "127.0.0.1:${PG_PORT:-5434}:5432"
    volumes:
      - mahjong-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahjong"]
      interval: 5s
      timeout:  3s
      retries:  10
    restart: unless-stopped

  # --- dogfood deploy (issue #30 step 2): docker compose --profile app up -d --build ---
  # PUBLIC_HOST is the name/IP browsers use to reach this machine; defaults to
  # localhost for same-machine play. LAN dogfood: PUBLIC_HOST=192.168.x.x
  server:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      MAHJONG_DB_URL: jdbc:postgresql://postgres:5432/mahjong
      MAHJONG_DB_PASSWORD: ${MAHJONG_DB_PASSWORD:-mahjong}
      # Which sites' browsers may use this API and open game sockets. Add more
      # (comma-separated) if you serve the UI from another origin. This stops
      # other websites acting as your players; it is not access control on the
      # API itself, which anything that isn't a browser can still call.
      MAHJONG_ALLOWED_ORIGINS: http://${PUBLIC_HOST:-localhost}:${WEB_PORT:-3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: webgame/frontend
      args:
        NEXT_PUBLIC_API_BASE: http://${PUBLIC_HOST:-localhost}:8080
        NEXT_PUBLIC_WS_BASE:  ws://${PUBLIC_HOST:-localhost}:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mahjong-pg:
