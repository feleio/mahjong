server {
  host = "0.0.0.0"
  host = ${?MAHJONG_SERVER_HOST}
  port = 8080
  port = ${?MAHJONG_SERVER_PORT}

  # Browser origins allowed to use the API and open game sockets — this bounds
  # what *other websites* can do with a player's browser, not who can reach the
  # API. "*" (the dev default) accepts any, so a fresh checkout works with
  # `pnpm dev` on whatever port it picks. Deployments set an exact list:
  #   MAHJONG_ALLOWED_ORIGINS="http://192.168.1.42:3000"
  allowedOrigins = "*"
  allowedOrigins = ${?MAHJONG_ALLOWED_ORIGINS}

  # Resource ceilings (issue #53). Rooms are held in memory and every running
  # game holds its own engine thread, so both are bounded; idle rooms are
  # evicted after roomTtlHours so abandoned ones cannot hold the cap.
  maxRooms = 200
  maxRooms = ${?MAHJONG_MAX_ROOMS}
  maxRunningGames = 32
  maxRunningGames = ${?MAHJONG_MAX_RUNNING_GAMES}
  roomTtlHours = 24
  roomTtlHours = ${?MAHJONG_ROOM_TTL_HOURS}
  createRoomsPerMinute = 10
  createRoomsPerMinute = ${?MAHJONG_CREATE_ROOMS_PER_MINUTE}
}

champion {
  # ONNX export of the champion policy net (net D). Relative paths resolve
  # against the server's working directory (repo root in dev).
  modelPath = "rl/checkpoints/best_raw_net.onnx"
  modelPath = ${?MAHJONG_CHAMPION_MODEL}
}

coach {
  # v4 danger-head model (opponent tenpai + per-tile deal-in heat, issue #37).
  # Optional: a missing file just disables the danger overlay; policy hints
  # still come from the champion model above.
  dangerModelPath = "rl/checkpoints/exit_v4/exit_final.onnx"
  dangerModelPath = ${?MAHJONG_DANGER_MODEL}
}

db {
  url      = "jdbc:postgresql://localhost:5434/mahjong"
  url      = ${?MAHJONG_DB_URL}
  user     = "mahjong"
  user     = ${?MAHJONG_DB_USER}
  password = "mahjong"
  password = ${?MAHJONG_DB_PASSWORD}
  driver   = "org.postgresql.Driver"
  poolSize = 8
}

# game-engine settings (loaded by the existing core engine)
isPauseWhenLog: false
minScore: 3
maxScore: 10
scoreMap: {
  3:  8,
  4:  16,
  5:  24,
  6:  32,
  7:  48,
  8:  64,
  9:  96,
  10: 128
}
